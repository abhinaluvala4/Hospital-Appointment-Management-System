services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital_dev_only
    ports:
      - "5432:5432"
    volumes:
      - hospital_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hospital_pgdata:
