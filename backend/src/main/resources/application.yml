spring:
  application:
    name: hospital-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hospital}
    username: ${DB_USERNAME:hospital}
    password: ${DB_PASSWORD:Abhi@1234}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-please-change-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
